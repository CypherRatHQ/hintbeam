name: Bug report
description: Something does not work as the docs say.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: hintbeam version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Web (React), Next.js, React Native, Expo, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: A tour definition and the smallest steps to reproduce help most.
    validations:
      required: true
