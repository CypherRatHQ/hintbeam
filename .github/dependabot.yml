# Dependency update pull requests. Nothing merges without a maintainer.
#
# cooldown: a new release is proposed only after it has been out for a week, so a broken or
# hijacked release is usually caught and pulled before it reaches us. Security updates skip the wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      dev-dependencies: { dependency-type: development }
    ignore:
      # Types for the oldest Node we support (package.json "engines"), so nothing newer slips in.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Expo and React Native move together, one Expo SDK at a time. Upgrade them by hand once the
      # new SDK is `latest` on npm: Dependabot can't tell Expo's prerelease SDKs from stable ones.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      site: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
