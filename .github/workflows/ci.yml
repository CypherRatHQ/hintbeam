name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job asks for only what it needs.
permissions: {}

# A new push to a pull request replaces the run still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (the comment says which release); Dependabot keeps them current.
# `--ignore-scripts`: no dependency runs code while installing. Nothing here needs it.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Every dependency is signed by the npm registry
        if: matrix.node == 24
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - name: Public API unchanged (or updated on purpose)
        run: npm run api:check
      - run: npm run format:check
      - run: npm run build
      - name: Package works for every resolver (publint, Are the Types Wrong)
        run: npm run check:package
      - name: Package contents
        run: npm pack --dry-run

  changeset:
    # Dependency updates and the release pull request change nothing users get on their own.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: A changeset describes this change (or none is needed)
        run: npx changeset status --since=origin/main

  site:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - working-directory: site
        run: npm ci --ignore-scripts && npm audit signatures && npm run lib && npm run build && npm run check:seo
